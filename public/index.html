<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>星环总控 · 管理中心</title>
  <link rel="stylesheet" href="/styles.css?v=12">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <section id="loginView" class="login-view" aria-labelledby="loginTitle">
    <form id="loginForm" class="login-card">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2l2.1 6.1L20 10l-5.9 2L12 18l-2.1-6L4 10l5.9-1.9L12 2z"/></svg></div>
      <p class="eyebrow">MULTI-SITE CONTROL</p>
      <h1 id="loginTitle">星环总控</h1>
      <p class="muted">一个入口，统一管理不同服务器上的导航站。</p>
      <div id="loginError" class="form-error" role="alert" hidden></div>
      <label>管理员账号<input name="username" autocomplete="username" required></label>
      <label>登录密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary full" type="submit">登录总后台</button>
    </form>
  </section>

  <div id="appShell" class="app-shell" hidden>
    <div class="shell">
      <header class="top">
        <div class="brand"><span class="brand-mark small" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2l2.1 6.1L20 10l-5.9 2L12 18l-2.1-6L4 10l5.9-1.9L12 2z"/></svg></span><span><strong>星环总控 · 管理中心</strong><small>多导航站统一控制面</small></span></div>
        <div class="top-actions"><div class="top-status"><span class="status-dot" aria-hidden="true"></span><span id="currentUser">已连接</span></div><button id="logoutButton" class="ghost logout">退出登录</button></div>
      </header>
      <button id="navToggle" class="secondary nav-toggle" type="button" aria-expanded="false" aria-controls="mainNav"><span>功能菜单</span><strong id="navCurrentLabel">概览仪表盘</strong><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <nav id="mainNav" class="sidebar tabs" aria-label="主要导航">
        <button data-view="dashboard" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"/></svg><span>概览仪表盘</span></button>
        <button data-view="sites"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>导航站</span></button>
        <button data-view="groups"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm8 1a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM3 20v-2a4 4 0 0 1 4-4h2a4 4 0 0 1 4 4v2m1-5h2a4 4 0 0 1 4 4v1"/></svg><span>站点分组</span></button>
        <button data-view="nodes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="12" cy="20" r="2"/><path d="m7 6 3 4m7-4-3 4m-2 5v3"/></svg><span>节点管理</span></button>
        <button data-view="ads"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 13 12-5v10L4 13Zm0 0v5h4l2 3h3l-3-6m8-5 2-2m-2 8 2 2"/></svg><span>广告管理</span></button>
        <button data-view="publish"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L8 8m4-4 4 4M5 13v7h14v-7"/></svg><span>永久发布页</span></button>
        <button data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.3 2.3-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-3.2v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-2.3-2.3.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H4.6v-3.2h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L6 8l2.3-2.3.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.2h3.2v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 8l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v3.2H21a1.7 1.7 0 0 0-1.6 1Z"/></svg><span>平台与告警设置</span></button>
        <button data-view="jobs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16H6zM9 9h6m-6 4h6m-6 4h4"/></svg><span>任务中心</span></button>
        <button data-view="audit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.6 2.8 8.1 7 10 4.2-1.9 7-5.4 7-10V6l-7-3Zm-3 8 2 2 4-4"/></svg><span>审计日志</span></button>
        <button data-view="security"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v2"/></svg><span>安全设置</span></button>
      </nav>
      <div class="workspace">
        <header class="topbar"><div><p class="eyebrow">CONTROL PLANE</p><h1 id="pageTitle" tabindex="-1">运行概览</h1></div><div class="live"><span class="status-dot" aria-hidden="true"></span>数据实时同步</div></header>
        <main id="main" tabindex="-1"><div id="content" aria-live="polite"></div></main>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal"><form method="dialog" class="modal-card"><header><div><p class="eyebrow" id="modalEyebrow">CONFIGURATION</p><h2 id="modalTitle">编辑</h2></div><button class="icon-button" type="button" data-modal-close aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header><div id="modalError" class="form-error modal-error" role="alert" tabindex="-1" hidden></div><div id="modalBody"></div></form></dialog>
  <script src="/app.js?v=20" defer></script>
</body>
</html>
